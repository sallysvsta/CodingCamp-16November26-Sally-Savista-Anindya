<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light/dark mode">🌙</button>

  <main class="container">
    <!-- Greeting -->
    <section class="card greeting-card">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date"></div>
      <h2 class="greeting">
        <span id="greeting-text">Good Morning</span>
        <button id="edit-name" class="edit-name" type="button" title="Set your name">✎</button>
      </h2>
    </section>

    <div class="grid">
      <div class="column">
        <!-- Focus Timer -->
        <section class="card">
          <h3 class="card-title center">Focus Timer</h3>
          <div id="timer-display" class="timer-display">25:00</div>
          <div class="timer-controls">
            <button id="timer-start" class="btn btn-primary" type="button">Start</button>
            <button id="timer-stop" class="btn btn-secondary" type="button">Stop</button>
            <button id="timer-reset" class="btn btn-secondary" type="button">Reset</button>
          </div>
        </section>

        <!-- Quick Links -->
        <section class="card">
          <h3 class="card-title">Quick Links</h3>
          <form id="link-form" class="link-form" autocomplete="off">
            <input id="link-name" type="text" placeholder="Link name" required>
            <input id="link-url" type="text" placeholder="URL" required>
            <button class="btn btn-primary" type="submit">Add Link</button>
          </form>
          <div id="link-list" class="link-list"></div>
        </section>
      </div>

      <!-- To-Do List -->
      <section class="card tasks-card">
        <h3 class="card-title">Tasks</h3>
        <form id="task-form" class="task-form" autocomplete="off">
          <input id="task-input" type="text" placeholder="Add a new task...">
          <button class="btn btn-primary" type="submit">Add</button>
        </form>
        <p id="task-message" class="task-message" role="alert"></p>
        <ul id="task-list" class="task-list"></ul>
      </section>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
